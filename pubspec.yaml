name: madarsaConnect
description: "Madarsa Management."

publish_to: 'none'

version: 1.0.2+6

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.0.17
  smooth_page_indicator: ^1.2.1
  intl: ^0.20.2
  http: ^1.0.0
  dropdown_search: ^6.0.2
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  firebase_auth: ^6.0.1
  firebase_core: ^4.1.0
  shared_preferences: ^2.5.3
  pie_chart: ^5.4.0
  syncfusion_flutter_charts: ^30.1.39
  percent_indicator: ^4.2.5
  firebase_analytics: ^12.0.0
  firebase_messaging: ^16.0.0
  permission_handler: ^12.0.1
  image_picker: ^1.0.7
  crop_your_image: ^1.1.0
  path_provider: ^2.1.5
  firebase_storage: ^13.0.0
  device_info_plus: ^11.5.0
  flutter_image_compress: ^2.4.0
  photo_view: ^0.15.0
  timeago: ^3.7.1
  path: ^1.9.1
  url_launcher: ^6.3.2
  firebase_app_check: ^0.4.0
  rxdart: ^0.28.0
  pdf: ^3.10.0
  printing: ^5.14.2
  uuid: ^4.5.1
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^6.3.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  share_plus: ^12.0.0
  provider: ^6.1.5+1
  flutter_native_splash: ^2.4.6
  fl_chart: 0.66.2
  in_app_update: ^4.2.5
  google_mobile_ads: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/india/data.json
    - assets/india/bank.json
    - assets/images/logo.png
  fonts:
    - family: Gilroy-Bold
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
    - family: Gilroy-Regular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
        
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo_engine.png
  android_gravity: center
  ios_content_mode: scaleAspectFit
  android_12:
    image: assets/images/logo_engine.png
    icon_background_color: "#ffffff"
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 29